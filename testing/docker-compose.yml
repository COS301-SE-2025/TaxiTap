version: '3.8'

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: taxi_tap_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/taxi_tap_rules.yml:/etc/prometheus/taxi_tap_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: taxi_tap_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring

  # AlertManager for alerting
  alertmanager:
    image: prom/alertmanager:latest
    container_name: taxi_tap_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - monitoring

  # Node Exporter for system metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: taxi_tap_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # JMeter for load testing
  jmeter:
    image: justb4/jmeter:latest
    container_name: taxi_tap_jmeter
    volumes:
      - ./jmeter:/tests
      - ./results:/results
    environment:
      - CONVEX_URL=${CONVEX_URL:-https://your-convex-deployment.convex.cloud}
      - API_KEY=${API_KEY:-your-api-key-here}
      - TEST_DURATION=${TEST_DURATION:-600}
    command: ["-n", "-t", "/tests/TaxiTap_Load_Test.jmx", "-l", "/results/jmeter_results.jtl"]
    networks:
      - monitoring

  # K6 for modern load testing
  k6:
    image: grafana/k6:latest
    container_name: taxi_tap_k6
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - CONVEX_URL=${CONVEX_URL:-https://your-convex-deployment.convex.cloud}
      - API_KEY=${API_KEY:-your-api-key-here}
    command: ["run", "/scripts/taxi_tap_load_test.js"]
    networks:
      - monitoring

  # Artillery for WebSocket testing
  artillery:
    image: artilleryio/artillery:latest
    container_name: taxi_tap_artillery
    volumes:
      - ./artillery:/scripts
      - ./results:/results
    environment:
      - CONVEX_URL=${CONVEX_URL:-wss://your-convex-deployment.convex.cloud}
      - API_KEY=${API_KEY:-your-api-key-here}
    command: ["run", "/scripts/taxi_tap_realtime_test.yml"]
    networks:
      - monitoring

  # Redis for caching (if needed)
  redis:
    image: redis:alpine
    container_name: taxi_tap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring

  # PostgreSQL for test data storage
  postgres:
    image: postgres:13
    container_name: taxi_tap_postgres
    environment:
      - POSTGRES_DB=taxi_tap_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring

  # Nginx for load balancing (if needed)
  nginx:
    image: nginx:alpine
    container_name: taxi_tap_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  redis_data:
  postgres_data:

networks:
  monitoring:
    driver: bridge
