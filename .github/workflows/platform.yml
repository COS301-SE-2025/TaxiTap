name: Platform CI

on:
  push:
    paths:
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/**'
  workflow_dispatch:

jobs:
  # === FRONTEND JOB ===
  frontend-test:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: platform/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('platform/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
      
      - name: Prettier
        run: npm run format

      - name: Run tests
        run: npm run test:frontend -- -u

  # === BACKEND JOB ===
  backend-typecheck:
    name: Backend - Convex Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Convex types
        run: npx convex codegen

      - name: Run backend tests
        run: npm run test:backend

      - name: Run integration tests
        run: npm run test:integration

  # === DEPLOY JOB (only on main) ===
  deploy:
    name: Deploy to Convex (main only)
    if: github.ref == 'refs/heads/dev'
    needs: [frontend-test, backend-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

  # === BUILD & RELEASE JOB (manual trigger or release tags only) ===
  build-and-release:
    name: Build APK and Create Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [frontend-test, backend-typecheck, deploy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      # Temporarily skip build step - using existing build
      - name: Download APK (Testing Fix)
        run: |
          # Use existing build ID instead of building
          # Replace 'YOUR_EXISTING_BUILD_ID' with actual build ID from dashboard
          BUILD_ID="834255d2-fd4e-42bd-9d29-c38387ea3d55"
          echo "Using existing build ID: $BUILD_ID"
          eas build:download --id="$BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get version from package.json
        id: package-version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.VERSION }}-${{ github.run_number }}
          release_name: TaxiTap v${{ steps.package-version.outputs.VERSION }}-${{ github.run_number }}
          body: |
            Automated release of TaxiTap APK

            **Changes:**
            - Latest changes from main branch
            - Version: ${{ steps.package-version.outputs.VERSION }}
            - Build: ${{ github.run_number }}

            **Download:**
            - Android APK: See attached files
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: platform/taxitap-release.apk
          asset_name: TaxiTap-latest.apk
          asset_content_type: application/vnd.android.package-archive